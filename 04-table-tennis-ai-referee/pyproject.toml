[project]
name = "table-tennis-ai-referee"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "torch==2.14.0",
    "torchvision==0.29.0",
    "ultralytics>=8.3,<9",
    "pyyaml>=6,<7",
]

[tool.uv]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
